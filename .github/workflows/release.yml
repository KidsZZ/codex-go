name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo 'Expected a version tag such as v0.1.0.' >&2
            exit 64
          }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify source version
        shell: bash
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          [[ "$RELEASE_TAG" == "v$version" ]] || {
            echo 'Tag and pubspec.yaml version do not match.' >&2
            exit 65
          }
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]
      - uses: ./.github/actions/setup-toolchain
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check source
        run: bash tool/check.sh
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          umask 077
          dart tool/configure_signing.dart
      - name: Build and verify release APK
        run: bash tool/build_android.sh --signed --no-pub
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            build/artifacts/*-release.apk build/artifacts/*-release.apk.sha256 \
            --verify-tag --draft --generate-notes --title "Codex Go $RELEASE_TAG"
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties build/ci-signing/release.jks
