name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check source
        run: bash tool/check.sh
      - name: Build preview APK
        run: bash tool/build_android.sh --no-pub
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codex-go-android-preview-${{ github.run_number }}
          path: |
            build/artifacts/*-preview.apk
            build/artifacts/*-preview.apk.sha256
          if-no-files-found: error
          retention-days: 14
