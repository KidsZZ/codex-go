name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/app lib/domain lib/features lib/infrastructure lib/runtime lib/shared lib/l10n/strings.dart lib/main.dart
      - run: flutter analyze --no-pub
      - run: bash tool/build_android.sh --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: codex-go-android-preview
          path: build/artifacts/*.apk
