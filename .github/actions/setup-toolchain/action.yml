name: Set up build toolchain
description: Install the pinned Flutter source and JDK used by local development.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          android/**/*.gradle.kts
          android/gradle/wrapper/gradle-wrapper.properties
    - name: Install pinned Flutter SDK
      shell: bash
      run: |
        set -euo pipefail
        version=$(node -p "require('./tool/flutter-sdk.json').version")
        revision=$(node -p "require('./tool/flutter-sdk.json').revision")
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
        sdk_dir="$RUNNER_TEMP/codex-go-flutter"
        git init "$sdk_dir"
        git -C "$sdk_dir" remote add origin https://github.com/flutter/flutter.git
        git -C "$sdk_dir" fetch --depth 1 origin "refs/tags/$version:refs/tags/$version"
        git -C "$sdk_dir" checkout --detach "$version"
        [[ "$(git -C "$sdk_dir" rev-parse HEAD)" == "$revision" ]]
        echo "$sdk_dir/bin" >> "$GITHUB_PATH"
    - name: Prepare Flutter
      shell: bash
      run: |
        flutter config --no-analytics
        flutter --version
        flutter precache --android
